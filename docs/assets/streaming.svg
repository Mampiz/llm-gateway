<text x="22" y="58" fill="#39c5cf" xml:space="preserve">$ curl -N localhost:8080/v1/chat/completions \</text>
<text x="22" y="79" fill="#39c5cf" xml:space="preserve">    -H "Authorization: Bearer $KEY" \</text>
