name: Test Chart

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: latest

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Lint
        run: helm lint deploy/helm/llm-gateway

      # Rendering is not enough on its own: a chart can render happily into
      # manifests the API server rejects.
      # kubeconform validates against the published Kubernetes schemas without
      # needing a cluster. `kubectl --dry-run=client` sounds offline but still
      # fetches the OpenAPI document from an API server, so it cannot run here.
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@latest

      - name: Validate the default render
        run: |
          helm template gw deploy/helm/llm-gateway \
            --set secrets.gatewayApiKeys="ci:gw_ci" \
            | kubeconform -strict -summary

      - name: Validate the non-default paths too
        run: |
          # ServiceMonitor is a CRD, so its schema is not in the standard set;
          # everything else still has to be valid.
          helm template gw deploy/helm/llm-gateway \
            --set secrets.existingSecret=my-secret \
            --set autoscaling.enabled=true \
            --set serviceMonitor.enabled=true \
            --set redis.url=redis://external:6379/0 \
            | kubeconform -strict -summary -ignore-missing-schemas

      - name: Alerting rules and dashboard parse
        run: |
          python3 -c "import yaml,sys;yaml.safe_load(open('deploy/prometheus-rules.yaml'))"
          python3 -c "import json,sys;json.load(open('deploy/grafana-dashboard.json'))"
