name: Release image

# Publishing is driven by tags: `git tag v0.2.0 && git push origin v0.2.0`
# builds the binaries, publishes the container image and drafts the notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  packages: write # push to ghcr.io

jobs:
  binaries:
    name: build-binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Cross-compiling is a matter of two environment variables because the
      # binary is static: no C toolchain per target, no containers.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="gateway"
          [ "$GOOS" = "windows" ] && name="gateway.exe"
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/$name" ./cmd/gateway
          tar -czf "llm-gateway_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}.tar.gz" -C dist "$name"

      - name: Checksums
        run: sha256sum llm-gateway_*.tar.gz > "checksums_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.txt"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            llm-gateway_*.tar.gz
            checksums_*.txt
          generate_release_notes: true

  image:
    name: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives tags from the git ref: v1.2.3 produces 1.2.3, 1.2, 1 and latest.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Ship a software bill of materials and build provenance alongside
          # the image, so consumers can see what is inside it and verify where
          # it came from.
          sbom: true
          provenance: mode=max
