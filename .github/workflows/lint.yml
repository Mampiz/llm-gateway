name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      # Naming go.sum explicitly breaks while the module still has no
      # dependencies, because git refuses a pathspec that does not exist.
      # Checking the whole tree works either way, and on a fresh checkout any
      # diff at all is a real problem.
      - name: go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy'"
            git diff
            exit 1
          fi
