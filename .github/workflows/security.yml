name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories are published continuously; a weekly run catches a CVE that
    # lands in a dependency long after the last commit.
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck (Go vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Reports only vulnerabilities reachable from this binary's call graph,
      # rather than every advisory affecting anything in the module graph.
      - name: Scan dependencies and the standard library
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  trivy:
    name: Trivy (image CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: llm-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for known CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: llm-gateway:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
